name: Validar

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      # sem checkout de proposito: a action le o repositorio pela API do GitHub.
      # Sem nenhum "ignore": o hacs/default recusa a inclusao com checagem desligada.
      # O icone vem de custom_components/controlart/brand/.
      - uses: hacs/action@main
        with:
          category: integration

  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # sem dependencias: o Home Assistant entra como modulos falsos (tests/ha_falso.py)
      - run: python -m unittest discover -s tests
